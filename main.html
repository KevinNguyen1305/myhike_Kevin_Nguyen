<!DOCTYPE html>
<html lang="en">

<head>
    <title>Home | ElmoHikes</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script type="module"
        src="/src/components/site-navbar.js"></script>

    <script type="module"
        src="/src/components/site-footer.js"></script>
</head>

<body>
    <site-navbar></site-navbar>

    <main class="container-fluid bg-light text-dark p-5">
        <div class="container p-3">
            <h1>Hello, <span id="user-name">there Kevin</span>!</h1>

            <hr>

            <p>
                Quote of the day:<span id="quote-goes-here"></span>
                Every step brings you closer to a new adventure.
            </p>
        </div>
    </main>
        <div class="container-fluid bg-body text-dark p-5">
        <a class="btn btn-success mb-3" href="addHike.html">➕ Add a hike</a>
        <h1>Popular Hikes</h1>
        <div id="hikes-go-here" class="row">
        </div>
    </div>

    <template id="hikeCardTemplate">
        <div class="col">
            <div class="card">
                <img class="card-img-top card-image" src="..." alt="Hike Image">
                <i class="bi bi-heart text-danger fs-4 fav-btn position-absolute top-0 end-0 m-2" role="button" title="Favourite"></i>
                <div class="card-body">
                    <h5 class="card-title"></h5>
                    <p class="card-text"></p>
                    <p>Length: <span class="card-length"></span> km</p>
                    <a class="btn btn-primary read-more" href="#">Read More</a>
                </div>
            </div>
        </div>
    </template>

    <site-footer></site-footer>

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
